[project]
name = "excludr"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "faker>=40.43.0",
    "fastapi[standard]>=0.150.0",
    "fastapi-fsp>=0.6.0",
    "httpx>=0.28.1",
    "bcrypt>=5.0.0",
    "prefect>=3.9.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "pymupdf>=2.0",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.48",
    "uvicorn>=0.54.0",
    "pydantic-ai>=2.62.0",
    "rispy>=0.10.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "--cov=app --cov-report=term-missing"
timeout = 60
pythonpath = ["."]
testpaths = [
    "tests",
]
markers = [
    "e2e: End-to-end integration tests that test complete user flows",
]

[tool.coverage.run]
omit = ["*/tests/*", "*/venv/*"]

[tool.ruff.lint]
# Ruff >=0.17 enables a much larger default rule set; keep the original baseline.
select = ["E4", "E7", "E9", "F", "B"]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "pytest-dotenv>=0.5.2",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.3",
]
